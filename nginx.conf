# 仅托管 Vite 构建出的静态文件；不连接任何业务后端。
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # HTTP 健康检查：供编排探针与 verify 服务冒烟使用。
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
